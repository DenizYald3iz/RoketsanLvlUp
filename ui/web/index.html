<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SENTINEL · Komuta Merkezi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="css/app.css" rel="stylesheet" />
</head>
<body>
  <header>
    <div class="brand"><span class="logo"></span>SENTINEL<small>// DRONE İSTİHBARAT KOMUTA MERKEZİ</small></div>
    <div class="stats">
      <div><small>ÇERÇEVE</small><b id="st-frames">0</b></div>
      <div><small>ARAÇ</small><b id="st-veh">0</b></div>
      <div><small>GLM UYARI</small><b id="st-alerts" class="red">0</b></div>
      <div><small>SİSTEM</small><b class="green blink">● ONLINE</b></div>
      <div><small>SAAT</small><b id="clock">--:--:--</b></div>
    </div>
  </header>

  <main>
    <aside class="left">
      <section class="panel">
        <h2>GÖRÜNTÜ GİRİŞİ</h2>
        <label id="drop" class="drop">
          <input id="file" type="file" accept="image/*" multiple hidden />
          <span>⬆ DRONE GÖRÜNTÜSÜ BIRAK / SEÇ</span>
          <small>dosya adı = image_id (örn. img_003839.jpg)</small>
        </label>
        <div class="row">
          <select id="sample"></select>
          <button id="demo">▶ DEMO</button>
        </div>
        <div class="row">
          <select id="glm-mode">
            <option value="live">GLM: CANLI ÇALIŞTIR (~2 dk, ~$0.002)</option>
            <option value="cached">GLM: KAYITLI ÇIKTI (varsa), yoksa canlı</option>
            <option value="off">GLM: KAPALI</option>
          </select>
        </div>
        <div id="meta-row" class="row meta">
          <input id="meta-id" placeholder="image_id (dosya adı farklıysa)" />
        </div>
      </section>
      <section class="panel grow">
        <h2 id="det-title">TESPİTLER</h2>
        <div id="imgview" class="imgview"></div>
        <div class="tablewrap">
          <table id="dets"><thead><tr><th>ID</th><th>TİP</th><th>CONF</th><th>KOORDİNAT</th><th>BÖLGE</th><th>GLM</th></tr></thead><tbody></tbody></table>
        </div>
      </section>
    </aside>

    <section class="center">
      <div id="map"></div>
      <div id="brain" class="brain"></div>
      <div id="inspect" class="inspect"></div>
      <div id="intel" class="intel"></div>
      <div class="hud tl">MERKEZ ÜS · 39.92184N 32.85306E</div>
      <div class="hud tr"><select id="basemap"><option value="sat">UYDU</option><option value="dark">KARANLIK</option></select></div>
      <div class="hud legend">
        <span style="--c:#22e6ff">OTOMOBİL</span><span style="--c:#b388ff">PANELVAN</span>
        <span style="--c:#ffb020">KAMYON</span><span style="--c:#ff4d6d">OTOBÜS</span>
      </div>
      <div id="logbox" class="logbox">
        <div class="loghead"><span>GLM · SİSTEM AKIŞI</span><button id="toggle-log" title="aç/kapat">▾</button></div>
        <div id="log" class="log"></div>
      </div>
      <button id="toggle-left" class="edge el" title="sol panel">◀</button>
      <button id="toggle-right" class="edge er" title="sağ panel">▶</button>
    </section>

    <aside class="right">
      <section class="panel">
        <h2>BÖLGE DURUMU</h2>
        <div id="zones" class="zones"></div>
      </section>
      <section class="panel grow">
        <h2>GLM AJAN UYARILARI</h2>
        <div id="alerts" class="alerts"></div>
      </section>
    </aside>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
